<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phúc Âu | Bio Link</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            text-align: center;
        }

        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 16px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .bio {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 20px;
            border-radius: 16px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .link-card:hover {
            background: rgba(56, 189, 248, 0.15);
            border-color: #38bdf8;
            transform: translateY(-2px);
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .link-icon {
            font-size: 20px;
            width: 24px;
            color: #38bdf8;
        }

        .arrow-icon {
            font-size: 14px;
            color: #64748b;
        }

        .footer {
            margin-top: 28px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Avatar -->
        <div class="avatar-container">
            <img src="https://ui-avatars.com/api/?name=Phuc+Au&background=0D8ABC&color=fff&size=128" alt="Trần Phúc Âu" class="avatar">
        </div>

        <!-- Info -->
        <h1>Trần Phúc Âu</h1>
        <p class="bio">📍 Quy Nhon Travel Creator & Personal Journal<br>"Yêu nét bình yên Xứ Nẫu – Chạm ngõ những vùng đất mới"</p>

        <!-- Bio Links -->
        <div class="links-container">
            
            <a href="https://www.tiktok.com/@phucauqn" target="_blank" class="link-card">
                <div class="link-content">
                    <i class="fa-brands fa-tiktok link-icon"></i>
                    <span>TikTok @phucauqn</span>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>

            <a href="https://www.facebook.com" target="_blank" class="link-card">
                <div class="link-content">
                    <i class="fa-brands fa-facebook link-icon"></i>
                    <span>Facebook Cá Nhân</span>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>

            <a href="https://www.youtube.com" target="_blank" class="link-card">
                <div class="link-content">
                    <i class="fa-brands fa-youtube link-icon"></i>
                    <span>Kênh YouTube</span>
                </div>
